image: sphinxdoc/sphinx

pages:
  stage: deploy
  pages: true
  script:
  - apt update
  - apt install -y plantuml wget
  - pip install --upgrade pip  
  - pip install -r ./documentation/sphinx-doc-generation/requirements.txt
  - wget -O /usr/share/plantuml/plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2024.7/plantuml.jar
  - cd ./documentation/sphinx-doc-generation && sphinx-build -b html . ../../public
  - ls ../../public/
  artifacts:
    paths:
      - public
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

