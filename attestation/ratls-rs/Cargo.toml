[package]
name = "ratls-rust"
version = "0.1.0"
edition = "2021"
authors = ["Jana Eisoldt"]

[dependencies]
# TLS libraries
rustls = "0.23.36"
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
rustls-pki-types = "1.12.0"
dcap-api = { path = "../dcap_api/" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Cryptography
sha2 = "0.10"
ring = "0.17"
x509-parser = "0.16"
der = "0.7"
pem = "3.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
bincode = "1.3"
hex = "0.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
bytes = "1.7"
tracing = "0.1"
tracing-subscriber = "0.3"

webpki-roots = "0.26"

# Optional platform dependencies
tss-esapi = { version = "7.5", optional = true }
openssl = { version = "0.10", optional = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
