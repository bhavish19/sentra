<div style="position: fixed; right: 0px;left:0px;top:100px;bottom: 0px; background: url('/images/background-client.png') no-repeat center center fixed; background-size: cover;">
<div style="display:grid;grid-template-columns: 400px 1fr; grid-template-rows: 1fr 1fr; gap: 10px; height: 100%;width: 100%;"> 
<div style="grid-column: 1; grid-row: 1; display: flex; align-items: center; justify-content: center;padding: 10px;">
 <!--   <app-image-selector/> -->
    <mat-card style="height:400px;width:100%" class="custom-elevation">
      <mat-card-header style="text-align: center;width:100%">
        <mat-card-title style="text-align: center;width:100%">Handwritten Digit</mat-card-title>
      </mat-card-header>
        <mat-divider style="margin-left: 10px;margin-right: 10px;"></mat-divider>
      <mat-card-content style="height: 100%;">
        <mnist-number-selector style="width:100%;height: 100%;" (imageSelected)="onImageSelected($event)"/>
    </mat-card-content>
    </mat-card>
</div>
<div  [ngClass]="{'disabled-card': isAIDisabled}" class="custom-elevation" style="grid-column: 2; grid-row: 1 / span 2;  display: flex; align-items: center; justify-content: center;">
 
 <app-ai-widget  [m_clientDashboard]="this"/>
</div>
<div style="grid-column: 1; grid-row: 2; display: flex; align-items: center; justify-content: center;padding: 10px;">
   <mat-card style="height:400px;width:100%" class="custom-elevation">
      <mat-card-header style="text-align: center;width:100%">
        <mat-card-title style="text-align: center;width:100%">Inference Result</mat-card-title>
      </mat-card-header>
        <mat-divider style="margin-left: 10px;margin-right: 10px;"></mat-divider>

    <mat-card-content style="height: 100%;">
  <prediction-result-display style="width: 100%;" [predictionProbabilities]=predictionProbabilities
  [predictedDigit]=predictionResult/>
    </mat-card-content>
    </mat-card>
</div>



</div>

<div id="moving-digit-image-div" class="message"  style="display: none;position: fixed;top: 50%;right:{{posRight_MovingDigitImage}}px">
 <img id="moving-digit-image-image" style="width:56px;height: 56px;"
        [src]="selectedImage?.image_b64"/>
</div>
