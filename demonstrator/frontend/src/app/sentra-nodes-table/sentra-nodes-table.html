<div class="table-container">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

    <!-- ID Column -->
    <ng-container matColumnDef="node_id">
      <th mat-header-cell *matHeaderCellDef>Node ID</th>
      <td mat-cell *matCellDef="let node">{{ node.node_id }}</td>
    </ng-container>

    <!-- Host Column -->
    <ng-container matColumnDef="host">
      <th mat-header-cell *matHeaderCellDef>Host</th>
      <td mat-cell *matCellDef="let node">{{ node.host }}</td>
    </ng-container>

    <!-- GRPC URL Column -->
    <ng-container matColumnDef="grpc_url">
      <th mat-header-cell *matHeaderCellDef>GRPC URL</th>
      <td mat-cell *matCellDef="let node">{{ node.grpc_url }}</td>
    </ng-container>

    <!-- CPU Column -->
    <ng-container matColumnDef="cpu">
      <th mat-header-cell *matHeaderCellDef>CPU</th>
      <td mat-cell *matCellDef="let node">{{ node.cpu }}</td>
    </ng-container>

    <!-- Operator Column -->
    <ng-container matColumnDef="operator">
      <th mat-header-cell *matHeaderCellDef>Operator</th>
      <td mat-cell *matCellDef="let node">{{ node.operator }}</td>
    </ng-container>

    <!-- Attested Column -->
    <ng-container matColumnDef="attested">
      <th mat-header-cell *matHeaderCellDef>Attested</th>
      <td mat-cell *matCellDef="let node">{{ node.attested }}</td>
    </ng-container>

    <!-- Table rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
