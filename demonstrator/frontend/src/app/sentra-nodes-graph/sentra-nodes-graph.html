<div #cyContainer class="cy-container">
<div id="moving-circle" style="position: absolute;
    width: 10px;
    height: 10px;
    background-color: red;
    border-radius: 50%;
    display: none; /* Initially hidden */
    z-index: 10;
    left: 50px;
    top: 50px;
    transform: translate(-50%, -50%);
    animation: flash 0.5s infinite;"></div>
    </div>
