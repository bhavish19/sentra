<!-- Selected digit image View -->

<div *ngIf="view === 'digit_image'" style="display:flex;justify-content: center;align-items: center;height: 100%;">
        <img (click)="onStartDigitSelection()" [src]="selectedImage" style="width:80%;object-fit: contain;border-radius: 15px;"/>
</div>


<!-- Initial View -->
<div *ngIf="view === 'selection_start'" style="display:flex;justify-content: center;align-items: center;height: 100%;">
        <button mat-raised-button color="primary" (click)="onStartDigitSelection()" style="justify-content: center;">
            Select or Draw Handwritten Digit for Inference
        </button>
</div>


<!-- Digit Selection View -->
<div *ngIf="view === 'digit'" style="justify-content: center;align-items: center;height: 100%;">
  Select existing Image for Digit
  <mat-divider/>
  <mat-grid-list cols="4" rowHeight="60px" gutterSize="12px" style="margin: auto;">
    <mat-grid-tile *ngFor="let digit of digits">
      <button mat-raised-button color="primary" (click)="selectDigit(digit)">
        {{ digit }}
      </button>
    </mat-grid-tile>
  </mat-grid-list>
    Draw Digit
  <mat-divider/>
      <button mat-raised-button color="primary" (click)="onDrawDigit()">Draw Digit</button>

</div>

<!-- Image Grid View -->
<div *ngIf="view === 'images'" class="image-grid-wrapper">
  <button mat-button (click)="backToDigits()" class="back-btn">← Back</button>
  <div *ngIf="loading" class="loading-spinner">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
  <div *ngIf="!loading" class="image-grid">
    <div
      class="image-tile"
      *ngFor="let img of images"
      [class.selected]="img.index === selectedIndex"
      (click)="selectImage(img)"
    >
      <img
        [src]="img.image_b64"
        alt="MNIST digit"
        class="mnist-image"
        draggable="false"
      />
  </div>

</div>
