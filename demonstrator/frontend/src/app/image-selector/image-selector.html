<div class="image-selector-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Select an image of a hand drawn number</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <!-- File Input -->
      <input
        type="file"
        accept="image/*"
        id="fileInput"
        (change)="onFileSelected($event)"
        hidden
      />

      <!-- Image Preview -->
      <div  class="image-preview">
               @if(imageSrc){

        <img [src]="imageSrc" alt="Selected Image" />
               }
      </div>

    <button mat-raised-button color="primary" (click)="triggerFileInput()">
        Select Image
      </button>

    </mat-card-content>
  </mat-card>
</div>
