syntax = "proto3";

package sentra_backend_grpc_services;

// Service definition for node registration
service NodeRegistration {
rpc NodeStream (stream NodeMessage) returns (stream ServerMessage);
}

// Request message containing node information
message RegisterRequest {
    string node_id = 1;
}

// Response message confirming registration
message RegisterResponse {
    bool success = 1;
    string message = 2;
}

// Message from node to server (client -> server)
message NodeMessage {
    oneof message_type {
        RegisterRequest register = 1;
    }
}

// Message from server to node (server -> client)
message ServerMessage {
    oneof message_type {
        RegisterResponse response = 1;
    }
}

