# SGX all-in-one: client distributor + eval (3 parties — fits one Occlum enclave).
# MNIST: client loads /mnist.npz only; nodes wait for shares (no download on nodes).
# Use: make sgx-run-with-client
# For 4+ parties in SGX, use sentra-deployment multi-node (one container per party).

headless: true
host: "127.0.0.1"
n-nodes: 3
t: 1
base-port: 9320
batch-size: 32
accum-steps: 1
num-epochs: 2
mnist-samples: 512
learning-rate: 0.01
seed: 2026
loss-mode: softmax
scale-factor: 65536
field-size: 2305843009213693951
softmax-temperature: 2.0
grad-clip: 0.5
logit-clip: 4.0
exp-approx: pade22
softmax-grad-mode: secure_approx
explode-logit-threshold: 100.0
loss-growth-threshold: 5.0
grad-norm-threshold: 1500.0
no-abort-on-instability: true
membership-epoch: 0
receive-dataset-shares-from-client: true
dataset-source-node-id: 0
dataset-distribution-timeout: 900.0
start-client-distributor: true
client-eval-after-training: true
client-eval-samples: 64
client-test-samples: 64
