# Build context = repository root (../.. from this file).
services:
  ml-benchmark:
    build:
      context: ../..
      dockerfile: benchmarking/ml-benchmark/Dockerfile.ml-benchmark
    image: sentra-ml-benchmark:latest
    environment:
      TF_CPP_MIN_LOG_LEVEL: "2"
    volumes:
      - ml_benchmark_logs:/workspace/node/logs

  ml-benchmark-sgx:
    build:
      context: ../..
      dockerfile: benchmarking/ml-benchmark/Dockerfile.ml-benchmark.sgx
    image: sentra-ml-benchmark-sgx:latest
    environment:
      TF_CPP_MIN_LOG_LEVEL: "2"
    devices:
      - "/dev/sgx_enclave:/dev/sgx_enclave"
      - "/dev/sgx_provision:/dev/sgx_provision"
    volumes:
      - ml_benchmark_logs:/workspace/node/logs

volumes:
  ml_benchmark_logs:
